# /etc/nginx/sites-available/quant   (NOT applied yet — cutover needs the owner's go)
# quant.jsyoo.dev → autotrade (FastAPI on :8890), which serves the built web app
# and /api/*. Auth is the app's PIN session cookie (host-only).
#
# Cutover steps (each confirmed with the owner first):
#   1. remove quant.jsyoo.dev from both server_name lines in nginx-portfolio.conf
#   2. sudo cp deploy/nginx-quant.conf /etc/nginx/sites-available/quant
#      sudo ln -s ../sites-available/quant /etc/nginx/sites-enabled/quant
#   3. sudo nginx -t && sudo systemctl reload nginx
# The old app keeps serving portfolio.jsyoo.dev on :8888.

server {
    listen 80;
    server_name quant.jsyoo.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quant.jsyoo.dev;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CSP and the other security headers come from the app (one place).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real client IP behind Cloudflare. PIN lockout is per IP (autotrade/api/deps.py),
    # so without this every request looks like a Cloudflare edge and one stranger's five
    # wrong PINs would lock the owner out too. Ranges from https://www.cloudflare.com/ips-v4/
    # and /ips-v6/ (fetched 2026-10-09); refresh them when Cloudflare changes the list.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
