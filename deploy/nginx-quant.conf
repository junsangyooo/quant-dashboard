# /etc/nginx/sites-available/quant   (NOT applied yet — cutover needs the owner's go)
# quant.jsyoo.dev → autotrade (FastAPI on :8890), which serves the built web app
# and /api/*. Auth is the app's PIN session cookie (host-only).
#
# Cutover steps (each confirmed with the owner first):
#   1. remove quant.jsyoo.dev from both server_name lines in nginx-portfolio.conf
#   2. sudo cp deploy/nginx-quant.conf /etc/nginx/sites-available/quant
#      sudo ln -s ../sites-available/quant /etc/nginx/sites-enabled/quant
#   3. sudo nginx -t && sudo systemctl reload nginx
# The old app keeps serving portfolio.jsyoo.dev on :8888.

server {
    listen 80;
    server_name quant.jsyoo.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quant.jsyoo.dev;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CSP and the other security headers come from the app (one place).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
