# /etc/nginx/sites-available/quant   (NOT applied yet — cutover needs the owner's go)
# quant.jsyoo.dev → autotrade (FastAPI on :8890), which serves the built web app and /api/*.
# Auth is the app's PIN session cookie (__Host-qsess, host-only). Server: nginx 1.18 (Ubuntu).
#
# Cutover (each step confirmed with the owner first):
#   0. autotrade.service runs and answers: curl -s http://127.0.0.1:8890/api/healthz
#   1. sudo cp /etc/nginx/sites-available/portfolio /etc/nginx/sites-available/portfolio.bak-$(date +%F)
#      then remove quant.jsyoo.dev from both server_name lines of /etc/nginx/sites-available/portfolio
#      (and of deploy/nginx-portfolio.conf in git, so deploy.sh's drift check stays quiet)
#   2. sudo cp ~/quant-dashboard/deploy/nginx-quant.conf /etc/nginx/sites-available/quant
#      sudo ln -s ../sites-available/quant /etc/nginx/sites-enabled/quant
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. checks (from the server unless noted):
#      curl -sI https://quant.jsyoo.dev/ | grep -i -e strict-transport -e '^server'
#         (from the laptop, through Cloudflare: HSTS present, 'server: cloudflare')
#      curl -sk -o /dev/null -w '%{http_code}\n' --resolve quant.jsyoo.dev:443:127.0.0.1 https://quant.jsyoo.dev/api/healthz   -> 200
#      curl -sk -o /dev/null -w '%{http_code}\n' --resolve quant.jsyoo.dev:443:127.0.0.1 -X POST -H 'Origin: https://quant.jsyoo.dev' https://quant.jsyoo.dev/api/auth/logout    -> 204
#      curl -sk -o /dev/null -w '%{http_code}\n' --resolve quant.jsyoo.dev:443:127.0.0.1 -X POST -H 'Origin: https://portfolio.jsyoo.dev' https://quant.jsyoo.dev/api/auth/logout -> 403
#         (the app compares the Origin with Host: nginx must pass `Host $host`, as below)
#      from the laptop, straight to the origin:
#      curl -sk -o /dev/null -w '%{http_code}\n' --resolve quant.jsyoo.dev:443:146.56.118.65 https://quant.jsyoo.dev/   -> 000 (closed: not Cloudflare)
#   Undo: sudo rm /etc/nginx/sites-enabled/quant, restore portfolio.bak-<date>, nginx -t, reload.
# portfolio.jsyoo.dev (:8888) is another app with its own nginx file.
#
# Cloudflare ranges (https://www.cloudflare.com/ips-v4/ and /ips-v6/, fetched 2026-10-09) appear
# twice: in the geo block (who may connect at all) and as set_real_ip_from (whose CF-Connecting-IP
# is believed). Keep the two lists the same (tests/autotrade/api/test_deploy_files.py checks) and
# refresh both when Cloudflare changes them: a missing range turns those edges' visitors away.

# Who may reach this origin: Cloudflare's edges, and the server itself for its own checks.
# $realip_remote_addr is the address that opened the connection, before real_ip_header replaces
# $remote_addr with the visitor's (so allow/deny on $remote_addr would judge the visitor, not
# the edge, and turn everyone away). Top level of this file = the http block.
geo $realip_remote_addr $quant_via_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name quant.jsyoo.dev;
    server_tokens off;
    if ($quant_via_cloudflare = 0) {
        return 444;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quant.jsyoo.dev;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Real client IP behind Cloudflare. PIN lockout is per address (autotrade/api/auth.py), so
    # without this every request looks like a Cloudflare edge and one stranger's five wrong PINs
    # would lock the owner out too. The same ranges as the geo block above.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Not Cloudflare (someone who found the origin's address): close without an answer.
    if ($quant_via_cloudflare = 0) {
        return 444;
    }

    # HSTS for this name only: no includeSubDomains (other *.jsyoo.dev sites decide for
    # themselves), no preload. A year; browsers then never try plain http for quant.jsyoo.dev.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP and the other security headers come from the app (one place); these two also cover
    # nginx's own answers (502 while the app restarts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        # The app checks the Origin of every write against this Host: keep `$host`.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
