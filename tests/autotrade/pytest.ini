# Makes `pytest tests/autotrade` self-contained: with this file the rootdir and confcutdir are
# tests/autotrade.
# Keep in step with [tool.pytest.ini_options] in autotrade/pyproject.toml.
[pytest]
addopts = -p no:cacheprovider
xfail_strict = true
filterwarnings =
    error::DeprecationWarning:autotrade.*
