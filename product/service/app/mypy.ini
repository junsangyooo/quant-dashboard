# mypy 2.4.1 설정(P1-02 ③). 대상: app/(`scripts/lint_allow.py mypy`가 `mypy app`으로 돌려요).
# 1단계는 원래 있던 오류를 고치지 않고 `tests/allow/mypy.txt`(파일 × 오류 번호마다 수 · 까닭)에 적어 두고 수가 늘면 실패해요.
[mypy]
python_version = 3.12
# strict를 바탕으로 두 가지만 꺼요(까닭):
# - warn_return_any 끔: sqlite3.Row · json이 주는 Any를 그대로 돌려주는 함수가 많아(DB 층 P1-07에서 정리) 지금은 소음이에요.
# - implicit_reexport 켬(= no_implicit_reexport 끔): `app.strategy`가 `pieces`의 이름을 다시 내보내는 옛 MVP 꼴이 남아 있어요
#   (P1-03에서 지움). 옮긴 모듈의 다시 내보내기 금지는 `tests/test_no_reexport.py`가 따로 봐요.
strict = True
warn_return_any = False
implicit_reexport = True
# 설치된 판에 타입 정보가 없는 바깥 패키지는 없어요(fastapi · uvicorn · cryptography · pydantic 모두 타입 포함).
ignore_missing_imports = False
show_error_codes = True
pretty = False
exclude = (?x)(^|/)(\.venv[^/]*|web|tests|data)/
